<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark · 版本状态</title>
  <link rel="stylesheet" href="risk-common.css" />
</head>
<body>

<!-- ══════════════ TOP HEADER ══════════════ -->
<header class="header">
  <div class="logo-wrap"><span class="logo-name">Spark</span></div>
  <nav class="header-nav">
    <button class="header-tab">AB测试</button>
    <button class="header-tab active">管理</button>
  </nav>
  <div class="header-right">
    <button class="hdr-action" title="反馈">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span>反馈</span>
    </button>
    <button class="hdr-action" title="消息" style="position:relative;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      <span>消息</span>
      <span style="position:absolute;top:2px;right:6px;width:8px;height:8px;background:#FF4D4F;border-radius:50%;border:1.5px solid #fff;"></span>
    </button>
    <button class="hdr-action" title="帮助">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
      <span>帮助</span>
    </button>
    <div class="hdr-divider"></div>
    <button class="user-btn" title="个人中心">
      <div class="user-avatar">张</div>
      <span class="user-name">张三</span>
    </button>
  </div>
</header>

<!-- ══════════════ SUB-BAR ══════════════ -->
<div class="subbar">
  <div class="subbar-inner">
    <nav class="breadcrumb">
      <a href="#">风控模块</a>
      <span class="sep"> / </span>
      <span class="current">版本状态</span>
    </nav>
  </div>
</div>

<!-- ══════════════ BODY ══════════════ -->
<div class="body-wrap">

  <!-- ──── Sidebar ──── -->
  <aside class="sidebar">
    <div class="nav-group">
      <div class="nav-l1" onclick="toggleNav(this)">
        <svg class="l1-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        AB测试
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="nav-l2-list" style="display:none;">
        <div class="nav-l2" onclick="location.href='index.html'">公司产品</div>
        <div class="nav-l2">产品信息</div>
        <div class="nav-l2">远程配置</div>
        <div class="nav-l2">用户群配置</div>
        <div class="nav-l2">实验管理</div>
        <div class="nav-l2">用户群标签管理</div>
        <div class="nav-l2">指标管理</div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-l1 open" onclick="toggleNav(this)">
        <svg class="l1-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        风控模块
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="nav-l2-list" style="display:block;">
        <div class="nav-l2 active">版本状态</div>
        <div class="nav-l2" onclick="location.href='risk-requests.html'">风险请求</div>
        <div class="nav-l2" onclick="location.href='risk-blacklist.html'">黑名单库</div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-l1" onclick="toggleNav(this)">
        <svg class="l1-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        实验/用户群查询
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="nav-l2-list" style="display:none;">
        <div class="nav-l2">实验用户查询</div>
        <div class="nav-l2">用户群/参数下发查询</div>
      </div>
    </div>
  </aside>

  <!-- ──── Content ──── -->
  <main class="content">

    <!-- 筛选条件 -->
    <div class="filter-box">
      <div class="filter-row">
        <div class="filter-item">
          <input class="filter-input" id="searchInput" type="text" placeholder="搜索产品ID / 产品名" />
        </div>

        <div class="filter-item">
          <span class="filter-lbl">部门</span>
          <div class="ms-wrap" data-key="dept">
            <button class="ms-btn" onclick="toggleMs(this, event)">
              <span class="ms-text">全部</span>
              <svg class="ms-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="ms-dropdown">
              <label class="ms-all"><input type="checkbox" checked onchange="msToggleAll(this)"> 全选</label>
              <label class="ms-item"><input type="checkbox" value="SC" checked onchange="msItemChange(this)"> SC</label>
              <label class="ms-item"><input type="checkbox" value="对战" checked onchange="msItemChange(this)"> 对战</label>
            </div>
          </div>
        </div>

        <div class="filter-item">
          <span class="filter-lbl">产品类型</span>
          <div class="ms-wrap" data-key="type">
            <button class="ms-btn" onclick="toggleMs(this, event)">
              <span class="ms-text">全部</span>
              <svg class="ms-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="ms-dropdown">
              <label class="ms-all"><input type="checkbox" checked onchange="msToggleAll(this)"> 全选</label>
              <label class="ms-item"><input type="checkbox" value="SC游戏" checked onchange="msItemChange(this)"> SC游戏</label>
              <label class="ms-item"><input type="checkbox" value="SC-品牌线" checked onchange="msItemChange(this)"> SC-品牌线</label>
              <label class="ms-item"><input type="checkbox" value="新框架" checked onchange="msItemChange(this)"> 新框架</label>
              <label class="ms-item"><input type="checkbox" value="对战游戏" checked onchange="msItemChange(this)"> 对战游戏</label>
              <label class="ms-item"><input type="checkbox" value="工具类" checked onchange="msItemChange(this)"> 工具类</label>
            </div>
          </div>
        </div>

        <div class="filter-item">
          <span class="filter-lbl">审核状态</span>
          <div class="ms-wrap" data-key="audit">
            <button class="ms-btn" onclick="toggleMs(this, event)">
              <span class="ms-text">全部</span>
              <svg class="ms-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="ms-dropdown">
              <label class="ms-all"><input type="checkbox" checked onchange="msToggleAll(this)"> 全选</label>
              <label class="ms-item"><input type="checkbox" value="审核中" checked onchange="msItemChange(this)"> 审核中</label>
              <label class="ms-item"><input type="checkbox" value="已过审" checked onchange="msItemChange(this)"> 已过审</label>
            </div>
          </div>
        </div>

        <button class="btn btn-default" onclick="resetFilters()">重置</button>
      </div>
    </div>

    <!-- 结果区 -->
    <div class="result-info-bar">
      <span class="result-count">共 <strong id="totalCount">0</strong> 条记录</span>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table id="vsTable">
          <thead>
            <tr>
              <th data-col="id" class="sortable">产品ID</th>
              <th data-col="name" class="sortable">产品名</th>
              <th data-col="version" class="sortable">最新版本</th>
              <th data-col="audit" class="sortable">审核状态</th>
              <th data-col="dept" class="sortable">部门</th>
              <th data-col="type" class="sortable">产品类型</th>
              <th data-col="createdAt" class="sortable">创建时间</th>
              <th style="text-align:center;width:80px;">操作</th>
            </tr>
          </thead>
          <tbody id="vsTbody"></tbody>
        </table>
      </div>

      <div class="pagination">
        <span class="page-info" id="pageInfo">共 0 条</span>
        <div style="display:flex;align-items:center;gap:4px;" id="pagerBtns"></div>
        <div style="display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;margin-left:8px;">
          每页
          <select class="page-size-select" id="pageSize" onchange="onPageSizeChange()">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
          </select>
          条
        </div>
      </div>
    </div>

  </main>

</div>

<!-- ══════════════ ACTION MENU (popover) ══════════════ -->
<div class="action-menu" id="actionMenu">
  <div class="action-menu-item" onclick="openVersionEditor()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    修改版本状态
  </div>
  <div class="action-menu-item" onclick="viewRiskRequests()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    查看风险请求
  </div>
</div>

<!-- ══════════════ MODAL ══════════════ -->
<div class="modal-mask" id="editModal">
  <div class="modal-box">
    <div class="modal-hd">
      <div class="modal-hd-text">
        <div class="modal-hd-title">修改版本状态</div>
        <div class="modal-hd-sub" id="editModalSub">—</div>
      </div>
      <button class="modal-x" onclick="closeEditModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="f-field">
        <label class="f-label">产品名</label>
        <input class="f-ctrl" id="editProductName" type="text" disabled />
      </div>
      <div class="f-field">
        <label class="f-label">最新版本 <span class="req">*</span></label>
        <input class="f-ctrl" id="editVersion" type="text" placeholder="如 1.2.3" />
      </div>
      <div class="f-field">
        <label class="f-label">审核状态 <span class="req">*</span></label>
        <select class="f-ctrl" id="editAudit" onchange="updateModalFooter(this.value)">
          <option value="审核中">审核中</option>
          <option value="已过审">已过审</option>
        </select>
      </div>
    </div>
    <div class="modal-ft" id="editModalFt">
      <button class="btn btn-default" id="editCancelBtn" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" id="editConfirmBtn" onclick="confirmEdit()">确定</button>
      <button class="btn btn-primary" id="editGoRiskBtn" style="display:none;" onclick="saveAndGoRisk()">保存并前往处理风险请求</button>
    </div>
  </div>
</div>

<!-- ══════════════ TOAST ══════════════ -->
<div class="toast" id="toast">
  <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#52C41A" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  <div class="toast-body">
    <div class="toast-title" id="toastTitle">操作成功</div>
    <div class="toast-desc" id="toastDesc">—</div>
  </div>
</div>

<script src="risk-common.js"></script>
<script>
  /* ════════════════════════
     版本状态 Mock Data
  ════════════════════════ */
  var DATA = [
    { id: '9007', name: 'Polaris Game',     version: '102',  audit: '已过审', dept: 'SC',   type: 'SC游戏',     createdAt: 1709251200000 },
    { id: '9008', name: 'StarRacer',        version: '88',   audit: '审核中', dept: 'SC',   type: 'SC游戏',     createdAt: 1714521600000 },
    { id: '9009', name: 'MythicWorld',      version: '305',  audit: '已过审', dept: 'SC',   type: 'SC-品牌线',  createdAt: 1717286400000 },
    { id: '9010', name: 'ZenRun',           version: '56',   audit: '已过审', dept: 'SC',   type: 'SC游戏',     createdAt: 1719964800000 },
    { id: '9011', name: 'Arena Clash',      version: '410',  audit: '已过审', dept: '对战', type: '对战游戏',   createdAt: 1701331200000 },
    { id: '9012', name: 'Sky Warriors',     version: '201',  audit: '审核中', dept: '对战', type: '对战游戏',   createdAt: 1706745600000 },
    { id: '9013', name: 'Battle Royale X',  version: '530',  audit: '已过审', dept: '对战', type: '对战游戏',   createdAt: 1696118400000 },
    { id: '9014', name: 'PK Framework',     version: '9',    audit: '审核中', dept: '对战', type: '新框架',     createdAt: 1722556800000 },
    { id: '9015', name: 'SC Toolkit',       version: '15',   audit: '已过审', dept: 'SC',   type: '工具类',     createdAt: 1693440000000 },
    { id: '9016', name: 'Brand Hub',        version: '223',  audit: '已过审', dept: 'SC',   type: 'SC-品牌线',  createdAt: 1725148800000 },
    { id: '9017', name: 'NeoQuest',         version: '158',  audit: '审核中', dept: 'SC',   type: 'SC游戏',     createdAt: 1727827200000 },
    { id: '9018', name: 'Frontier Arena',   version: '330',  audit: '已过审', dept: '对战', type: '对战游戏',   createdAt: 1730505600000 },
    { id: '9019', name: 'Hyper Tournament', version: '271',  audit: '已过审', dept: '对战', type: '对战游戏',   createdAt: 1733097600000 },
    { id: '9020', name: 'Pocket Saga',      version: '10',   audit: '审核中', dept: 'SC',   type: 'SC游戏',     createdAt: 1735776000000 },
    { id: '9021', name: 'GalaxyForge',      version: '452',  audit: '已过审', dept: 'SC',   type: 'SC-品牌线',  createdAt: 1738454400000 },
    { id: '9022', name: 'PK SDK',           version: '7',    audit: '审核中', dept: '对战', type: '新框架',     createdAt: 1741132800000 },
    { id: '9023', name: 'Star Sage',        version: '264',  audit: '已过审', dept: 'SC',   type: 'SC游戏',     createdAt: 1743724800000 },
    { id: '9024', name: 'Lane Master',      version: '317',  audit: '已过审', dept: '对战', type: '对战游戏',   createdAt: 1746403200000 },
    { id: '9025', name: 'SparkAnalytics',   version: '132',  audit: '已过审', dept: 'SC',   type: '工具类',     createdAt: 1749081600000 },
    { id: '9026', name: 'Champion Clash',   version: '500',  audit: '审核中', dept: '对战', type: '对战游戏',   createdAt: 1751673600000 }
  ];

  var DEPTS_ALL = ['SC', '对战'];
  var TYPES_ALL = ['SC游戏', 'SC-品牌线', '新框架', '对战游戏', '工具类'];
  var AUDIT_ALL = ['审核中', '已过审'];

  var state = {
    search: '',
    dept: DEPTS_ALL.slice(),
    type: TYPES_ALL.slice(),
    audit: AUDIT_ALL.slice(),
    sortCol: null, sortDir: 'asc',
    page: 1, pageSize: 20,
    editingRow: null
  };

  function filterRows() {
    var s = state.search;
    return DATA.filter(function(p) {
      if (state.dept.indexOf(p.dept) === -1) return false;
      if (state.type.indexOf(p.type) === -1) return false;
      if (state.audit.indexOf(p.audit) === -1) return false;
      if (s) {
        var hay = (p.id + ' ' + p.name).toLowerCase();
        if (hay.indexOf(s) === -1) return false;
      }
      return true;
    });
  }

  function auditCell(a) {
    var cls = a === '已过审' ? 'tag tag-online' : 'tag tag-pending';
    return '<span class="' + cls + '">' + a + '</span>';
  }

  function deptCell(d) {
    var cls = d === 'SC' ? 'tag tag-dept-sc' : 'tag tag-dept-pk';
    return '<span class="' + cls + '">' + d + '</span>';
  }

  function rowHtml(p, idx) {
    return '<tr>'
      + '<td><span class="mono">' + p.id + '</span></td>'
      + '<td><button class="link" onclick="goToHistory(\'' + p.id + '\')">' + p.name + '</button></td>'
      + '<td><span class="mono">' + p.version + '</span></td>'
      + '<td>' + auditCell(p.audit) + '</td>'
      + '<td>' + deptCell(p.dept) + '</td>'
      + '<td>' + p.type + '</td>'
      + '<td><span class="mono">' + formatTime(p.createdAt) + '</span></td>'
      + '<td style="text-align:center;">'
      +   '<button class="dot-btn" onclick="openActionMenu(event, ' + idx + ')">'
      +     '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'
      +   '</button>'
      + '</td>'
      + '</tr>';
  }

  function goToHistory(productId) {
    var lastTab = localStorage.getItem('riskRequestsLastTab') || 'latest';
    location.href = 'risk-requests.html?productId=' + encodeURIComponent(productId) + '&tab=' + lastTab;
  }

  function render() {
    var rows = sortRows(filterRows(), state, DATA[0] || {});
    var total = rows.length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('pageInfo').textContent = '共 ' + total + ' 条';

    var totalPages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * state.pageSize;
    var pageRows = rows.slice(start, start + state.pageSize);

    var tbody = document.getElementById('vsTbody');
    if (pageRows.length === 0) {
      tbody.innerHTML = emptyRow(8);
    } else {
      tbody.innerHTML = pageRows.map(function(p) {
        var origIdx = DATA.indexOf(p);
        return rowHtml(p, origIdx);
      }).join('');
    }
    renderPager('pagerBtns', state.page, totalPages, gotoPage);
  }

  function gotoPage(p) { state.page = p; render(); }
  function onPageSizeChange() {
    state.pageSize = parseInt(document.getElementById('pageSize').value, 10);
    state.page = 1; render();
  }

  /* ── Search ── */
  document.getElementById('searchInput').addEventListener('input', function(e) {
    state.search = e.target.value.trim().toLowerCase();
    state.page = 1; render();
  });

  function resetFilters() {
    document.getElementById('searchInput').value = '';
    state.search = '';
    state.dept = DEPTS_ALL.slice();
    state.type = TYPES_ALL.slice();
    state.audit = AUDIT_ALL.slice();
    state.page = 1;
    resetAllMs();
    render();
  }

  /* ── Action menu ── */
  function openActionMenu(event, idx) {
    event.stopPropagation();
    state.editingRow = idx;
    var menu = document.getElementById('actionMenu');
    var rect = event.currentTarget.getBoundingClientRect();
    menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';
    menu.style.left = (rect.right - 160 + window.scrollX) + 'px';
    menu.classList.add('open');
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.action-menu') && !e.target.closest('.dot-btn')) {
      document.getElementById('actionMenu').classList.remove('open');
    }
  });

  function openVersionEditor() {
    document.getElementById('actionMenu').classList.remove('open');
    var row = DATA[state.editingRow];
    if (!row) return;
    document.getElementById('editModalSub').textContent = row.id + ' · ' + row.name;
    document.getElementById('editProductName').value = row.name;
    document.getElementById('editVersion').value = row.version;
    document.getElementById('editAudit').value = row.audit;
    updateModalFooter(row.audit);
    document.getElementById('editModal').classList.add('open');
  }

  function updateModalFooter(audit) {
    var cancelBtn  = document.getElementById('editCancelBtn');
    var confirmBtn = document.getElementById('editConfirmBtn');
    var goRiskBtn  = document.getElementById('editGoRiskBtn');
    if (audit === '已过审') {
      cancelBtn.style.display  = 'none';
      confirmBtn.style.display = 'none';
      goRiskBtn.style.display  = '';
    } else {
      cancelBtn.style.display  = '';
      confirmBtn.style.display = '';
      goRiskBtn.style.display  = 'none';
    }
  }

  function closeEditModal() { document.getElementById('editModal').classList.remove('open'); }

  function confirmEdit() {
    var row = DATA[state.editingRow];
    if (!row) return;
    row.version = document.getElementById('editVersion').value.trim() || row.version;
    row.audit   = document.getElementById('editAudit').value;
    closeEditModal();
    render();
    showToast('修改成功', row.name + ' 版本状态已更新');
  }

  function saveAndGoRisk() {
    var row = DATA[state.editingRow];
    if (!row) return;
    row.version = document.getElementById('editVersion').value.trim() || row.version;
    row.audit   = document.getElementById('editAudit').value;
    closeEditModal();
    var lastTab = localStorage.getItem('riskRequestsLastTab') || 'latest';
    location.href = 'risk-requests.html?productId=' + encodeURIComponent(row.id) + '&tab=' + lastTab;
  }
  function viewRiskRequests() {
    document.getElementById('actionMenu').classList.remove('open');
    var row = DATA[state.editingRow];
    if (!row) return;
    var lastTab = localStorage.getItem('riskRequestsLastTab') || 'latest';
    location.href = 'risk-requests.html?productId=' + encodeURIComponent(row.id) + '&tab=' + lastTab;
  }

  /* ── Sort ── */
  document.querySelectorAll('#vsTable thead th.sortable').forEach(function(th) {
    th.addEventListener('click', function() {
      var col = th.getAttribute('data-col');
      if (state.sortCol === col) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortCol = col; state.sortDir = 'asc'; }
      document.querySelectorAll('#vsTable thead th').forEach(function(h) { h.classList.remove('sort-asc', 'sort-desc'); });
      th.classList.add(state.sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      render();
    });
  });

  render();
</script>
</body>
</html>
